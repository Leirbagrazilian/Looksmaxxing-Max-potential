<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<meta name="color-scheme" content="dark">
<title>{% block title %}Ascend{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('today') }}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 21 20H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10l4 7H8z" fill="currentColor"/></svg>
    Ascend
  </a>
  <a class="rankchip" href="{{ url_for('profile') }}" title="{{ rank.xp }} XP">
    <span class="tier">{{ rank.tier }}</span><span class="rname">{{ rank.name }}</span>
    <b style="--p:{{ (100 * rank.progress)|round|int }}%"></b>
  </a>
</header>

<main>{% block body %}{% endblock %}</main>

<nav class="tabs" aria-label="Main">
  {% set ep = request.endpoint %}
  <a href="{{ url_for('today') }}" class="{{ 'on' if ep == 'today' }}">
    <svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Quests</a>
  <a href="{{ url_for('scan') }}" class="{{ 'on' if ep in ('scan', 'scan_upload', 'report') }}">
    <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="11" r="3.5"/><path d="M7 18c1.2-2 2.9-3 5-3s3.8 1 5 3"/></svg>Scan</a>
  <a href="{{ url_for('progress') }}" class="{{ 'on' if ep == 'progress' }}">
    <svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M5 16l4-5 4 3 6-8"/></svg>Progress</a>
  <a href="{{ url_for('profile') }}" class="{{ 'on' if ep == 'profile' }}">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profile</a>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
