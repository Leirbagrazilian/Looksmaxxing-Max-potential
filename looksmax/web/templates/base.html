<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Max Potential{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('today') }}">Max Potential</a>
  <nav>
    <a href="{{ url_for('today') }}" class="{{ 'on' if request.endpoint == 'today' }}">Today</a>
    <a href="{{ url_for('progress') }}" class="{{ 'on' if request.endpoint == 'progress' }}">Progress</a>
    <a href="{{ url_for('settings') }}" class="{{ 'on' if request.endpoint == 'settings' }}">Settings</a>
  </nav>
</header>
<main>{% block body %}{% endblock %}</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
